name: PTR/SMTP Compatibility Test

on:
  workflow_dispatch:
    inputs:
      setup_dns:
        description: "Configurar SPF/DKIM/DMARC no deSEC antes do teste"
        type: boolean
        default: false
      allow_ipv4_fallback:
        description: "Continuar o teste mesmo se o túnel IPv6 falhar (não recomendado)"
        type: boolean
        default: false

jobs:
  ptr-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Configurar DNS (SPF/DKIM/DMARC) no deSEC
        if: ${{ inputs.setup_dns }}
        env:
          DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
          TEST_DOMAIN: veriscop.dedyn.io
          ROUTE64_IPV6_PREFIX: "2a11:6c7:f35:e3::/64"
        run: python dns_setup.py

      - name: Instalar ferramentas de diagnóstico
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools tcpdump conntrack iproute2 dnsutils netcat-openbsd

      - name: DIAGNÓSTICO COMPLETO — Túnel WireGuard (Route64)
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          WG_PEER_PUBKEY: ${{ secrets.WG_PEER_PUBKEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_ADDRESS: ${{ secrets.WG_ADDRESS }}
        run: |
          ENDPOINT_HOST=$(echo "$WG_ENDPOINT" | cut -d: -f1)
          ENDPOINT_PORT=$(echo "$WG_ENDPOINT" | cut -d: -f2)
          IFACE=$(ip route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if ($i=="dev") print $(i+1)}')

          echo "=================================================================="
          echo "PASSO 0 — Estado da rede ANTES de qualquer coisa"
          echo "=================================================================="
          echo "Interface física detectada: $IFACE"
          echo "Meu IP público (v4): $(curl -s https://api.ipify.org)"
          ip -6 addr show
          echo ""
          ip -6 route show
          echo ""
          echo "--- Regras de firewall locais (se houver) ---"
          sudo iptables -L -n -v 2>/dev/null || echo "(sem iptables ou vazio)"
          sudo ip6tables -L -n -v 2>/dev/null || echo "(sem ip6tables ou vazio)"

          echo ""
          echo "=================================================================="
          echo "PASSO 1 — Baseline UDP (prova que UDP entrada/saída funciona)"
          echo "=================================================================="
          dig +time=3 +tries=1 @8.8.8.8 example.com || echo "!!! UDP baseline FALHOU — problema é mais amplo que o route64.org"

          echo ""
          echo "=================================================================="
          echo "PASSO 2 — ICMP direto ao endpoint do route64.org"
          echo "=================================================================="
          ping -c 3 -W 3 "$ENDPOINT_HOST" || echo "ICMP para $ENDPOINT_HOST falhou"

          echo ""
          echo "=================================================================="
          echo "PASSO 3 — Captura de pacotes brutos ligada ANTES do wg-quick up"
          echo "=================================================================="
          # Captura tudo de/para o endpoint, na interface física real (não no wg0,
          # que ainda nem existe) -- isso é o que prova, byte a byte, o que
          # realmente sai do runner e o que (não) volta.
          sudo tcpdump -ni "$IFACE" -w /tmp/handshake_capture.pcap \
            "host $ENDPOINT_HOST" &
          TCPDUMP_PID=$!
          sleep 1
          echo "tcpdump rodando em background (PID $TCPDUMP_PID) na interface $IFACE"

          echo ""
          echo "=================================================================="
          echo "PASSO 4 — Subir o túnel WireGuard"
          echo "=================================================================="
          sudo mkdir -p /etc/wireguard
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${WG_PRIVATE_KEY}
          Address = ${WG_ADDRESS}

          [Peer]
          PublicKey = ${WG_PEER_PUBKEY}
          AllowedIPs = ::/1, 8000::/1
          Endpoint = ${WG_ENDPOINT}
          PersistentKeepalive = 15
          EOF
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

          echo ""
          echo "=================================================================="
          echo "PASSO 5 — Monitorando handshake em tempo real (20s, a cada 2s)"
          echo "=================================================================="
          for i in $(seq 1 10); do
            sleep 2
            TS=$(date -u +%H:%M:%S)
            HS=$(sudo wg show wg0 latest-handshakes | awk '{print $2}')
            TRANSFER=$(sudo wg show wg0 transfer)
            echo "[$TS] tentativa $i/10 -- handshake epoch: '${HS:-vazio}' -- transfer: ${TRANSFER:-vazio}"
          done

          echo ""
          echo "=================================================================="
          echo "PASSO 6 — Estado final detalhado do WireGuard"
          echo "=================================================================="
          sudo wg show wg0 dump
          echo ""
          sudo wg showconf wg0

          echo ""
          echo "=================================================================="
          echo "PASSO 7 — conntrack: existe algum fluxo UDP rastreado pro endpoint?"
          echo "=================================================================="
          sudo conntrack -L 2>/dev/null | grep -i "$ENDPOINT_HOST" || echo "Nenhuma entrada de conntrack encontrada para $ENDPOINT_HOST"

          echo ""
          echo "=================================================================="
          echo "PASSO 8 — Teste de ping via túnel"
          echo "=================================================================="
          ping6 -c 5 -W 3 2a11:6c7:f35:e3::1 || echo "Ping via túnel falhou"

          echo ""
          echo "=================================================================="
          echo "PASSO 9 — Parando a captura e resumindo os pacotes vistos"
          echo "=================================================================="
          sudo kill $TCPDUMP_PID 2>/dev/null || true
          sleep 1
          echo "--- Todos os pacotes capturados (saída E entrada, com tamanho exato) ---"
          sudo tcpdump -nr /tmp/handshake_capture.pcap -v 2>/dev/null || echo "Nenhum pacote capturado no arquivo."

          SENT=$(sudo tcpdump -nr /tmp/handshake_capture.pcap 2>/dev/null | grep -c "> ${ENDPOINT_HOST}" || echo 0)
          RECV=$(sudo tcpdump -nr /tmp/handshake_capture.pcap 2>/dev/null | grep -c "${ENDPOINT_HOST}\." || echo 0)
          echo ""
          echo ">>> RESUMO FINAL <<<"
          echo "Pacotes de SAÍDA capturados: $SENT"
          echo "Pacotes de ENTRADA capturados: $RECV"

          if [ "$RECV" = "0" ]; then
            echo "IPV6_TUNNEL_OK=false" >> "$GITHUB_ENV"
            echo "::error::Confirmado por captura de pacotes: ZERO bytes voltaram do endpoint $ENDPOINT_HOST:$ENDPOINT_PORT, mesmo com $SENT pacote(s) de saída confirmados. O arquivo .pcap será anexado ao artifact final para inspeção no Wireshark."
          else
            echo "IPV6_TUNNEL_OK=true" >> "$GITHUB_ENV"
          fi

          # Copia o pcap para o workspace pra poder subir como artifact depois
          cp /tmp/handshake_capture.pcap "${GITHUB_WORKSPACE}/handshake_capture.pcap"

      - name: Upload da captura de pacotes (.pcap) para inspeção no Wireshark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-handshake-pcap-${{ github.run_id }}
          path: handshake_capture.pcap
          retention-days: 14

      - name: Abortar se túnel IPv6 falhou (a menos que fallback seja permitido)
        if: ${{ env.IPV6_TUNNEL_OK != 'true' && !inputs.allow_ipv4_fallback }}
        run: |
          echo "::error::Parando o job: túnel IPv6/Route64 não subiu e allow_ipv4_fallback está desativado."
          echo "Baixa o artifact 'wireguard-handshake-pcap-${{ github.run_id }}' e abre no Wireshark pra ver exatamente o que aconteceu byte a byte."
          exit 1

      - name: Rodar teste SMTP nos domínios
        env:
          TEST_LANE: ${{ env.IPV6_TUNNEL_OK == 'true' && 'route64' || 'ipv4-fallback' }}
        run: python smtp_probe.py

      - name: Derrubar túnel
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptr-smtp-report-${{ github.run_id }}
          path: |
            report.json
            report.csv
            report.md
          retention-days: 30
