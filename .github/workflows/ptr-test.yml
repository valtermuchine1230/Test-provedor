name: PTR/SMTP Compatibility Test (DEBUG - chaves diretas)

on:
  workflow_dispatch:

jobs:
  ptr-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools tcpdump conntrack dnsutils

      - name: Confirmar integridade da chave (sem hardcode -- valor vem do secret)
        run: |
          PRIV="0MYdgLXPDibSxROkmbx9CXoxOQBQD8TdZt4tv1yhZGE="
          echo "Comprimento: $(echo -n "$PRIV" | wc -c) (esperado: 44)"
          echo "Chave pública derivada desta privada:"
          echo "$PRIV" | wg pubkey
          echo ""
          echo "Compara a linha acima com o que está no painel route64.org"
          echo "para o túnel tb35370. Se não bater, a chave nunca foi a certa."

      - name: Subir túnel WireGuard (valores hardcoded, teste isolado)
        run: |
          sudo mkdir -p /etc/wireguard
          cat <<'EOF' | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = 0MYdgLXPDibSxROkmbx9CXoxOQBQD8TdZt4tv1yhZGE=
          Address = 2a11:6c7:f35:e3::2/64

          [Peer]
          PublicKey = 7bUaqpBf7vDYZovWepLoM+AN70MuKYH3IGPOyrdIgWA=
          AllowedIPs = ::/1, 8000::/1
          Endpoint = 23.154.9.27:20119
          PersistentKeepalive = 15
          EOF
          sudo chmod 600 /etc/wireguard/wg0.conf

          echo "### Conteúdo do wg0.conf gerado (confirma visualmente) ###"
          sudo cat /etc/wireguard/wg0.conf

          echo ""
          echo "### Iniciando captura tcpdump ###"
          sudo tcpdump -ni any "udp and host 23.154.9.27" -w /tmp/wg_capture.pcap &
          TCPDUMP_PID=$!
          sleep 1

          sudo wg-quick up wg0

          echo "### Aguardando handshake (até 20s) ###"
          HANDSHAKE_OK=0
          for i in $(seq 1 10); do
            sleep 2
            HS=$(sudo wg show wg0 latest-handshakes | awk '{print $2}')
            TRANSFER=$(sudo wg show wg0 transfer)
            echo "[tentativa $i/10] handshake epoch: '${HS:-vazio}' -- transfer: ${TRANSFER:-vazio}"
            if [ -n "$HS" ] && [ "$HS" != "0" ]; then
              echo ">>> Handshake confirmado (epoch $HS) <<<"
              HANDSHAKE_OK=1
              break
            fi
          done

          sleep 3
          sudo kill "$TCPDUMP_PID" 2>/dev/null || true
          sleep 1

          echo ""
          echo "### wg show (estado final) ###"
          sudo wg show wg0 dump

          echo ""
          echo "### Captura tcpdump completa ###"
          sudo tcpdump -r /tmp/wg_capture.pcap -nn -v 2>&1 || echo "(sem pacotes)"

          echo ""
          echo "### Contagem por direção ###"
          echo "-- Saída --"
          sudo tcpdump -r /tmp/wg_capture.pcap -nn "dst host 23.154.9.27" 2>/dev/null | wc -l
          echo "-- Entrada --"
          sudo tcpdump -r /tmp/wg_capture.pcap -nn "src host 23.154.9.27" 2>/dev/null | wc -l

          echo ""
          echo "### conntrack ###"
          sudo conntrack -L 2>/dev/null | grep "dst=23.154.9.27" || echo "(nenhuma entrada)"

          if [ "$HANDSHAKE_OK" = "1" ]; then
            echo "RESULTADO: FUNCIONOU com chaves hardcoded -- o problema estava no GitHub Secret"
            echo "(provavelmente espaço/quebra de linha ao colar o secret)."
          else
            echo "RESULTADO: FALHOU mesmo com chaves hardcoded, idênticas ao painel."
            echo "Isto elimina o secret como causa. O problema está do lado do route64.org"
            echo "(chave pública não reconhecida, tunnel ID inativo, ou o servidor não está"
            echo "a aceitar handshakes deste IP/ASN por algum motivo do lado deles)."
          fi

      - name: Derrubar túnel
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Upload da captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wg-debug-capture
          path: /tmp/wg_capture.pcap
          retention-days: 5
