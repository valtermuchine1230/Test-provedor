name: PTR/SMTP Compatibility Test

on:
  workflow_dispatch:
    inputs:
      setup_dns:
        description: "Configurar SPF/DKIM/DMARC no deSEC antes do teste"
        type: boolean
        default: false
      allow_ipv4_fallback:
        description: "Continuar o teste mesmo se o túnel IPv6 falhar (não recomendado)"
        type: boolean
        default: false

jobs:
  ptr-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Configurar DNS (SPF/DKIM/DMARC) no deSEC
        if: ${{ inputs.setup_dns }}
        env:
          DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
          TEST_DOMAIN: veriscop.dedyn.io
          ROUTE64_IPV6_PREFIX: "2a11:6c7:f35:e3::/64"
        run: python dns_setup.py

      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wireguard-tools tcpdump conntrack dnsutils

      - name: Registar o IP atual deste runner no route64.org (DynDNS2)
        env:
          ROUTE64_API_KEY: ${{ secrets.ROUTE64_API_KEY }}
          ROUTE64_USERNAME: ${{ secrets.ROUTE64_USERNAME }}
          ROUTE64_TUNNEL_ID: "35370"
        run: |
          MY_IP=$(curl -s https://api.ipify.org)
          echo "IP público deste runner: $MY_IP"

          RESPONSE=$(curl -s -u "${ROUTE64_USERNAME}:${ROUTE64_API_KEY}" \
            "https://manager.route64.org/nic/update?hostname=${ROUTE64_TUNNEL_ID}&myip=${MY_IP}")
          echo "Resposta do route64.org: $RESPONSE"

          if [[ "$RESPONSE" == good* || "$RESPONSE" == nochg* ]]; then
            echo "Endpoint registado/confirmado com sucesso."
          else
            echo "::error::Falha ao atualizar o endpoint no route64.org: '$RESPONSE'"
            echo "Códigos possíveis: badauth (credenciais erradas), nohost (tunnel ID errado), badip (IP/família inválida), abuse (muito cedo -- só pode atualizar a cada ~10min), 911 (erro do servidor deles)."
            exit 1
          fi

          echo "Aguardando propagação..."
          sleep 8

      - name: Subir túnel WireGuard (Route64)
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          WG_PEER_PUBKEY: ${{ secrets.WG_PEER_PUBKEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_ADDRESS: ${{ secrets.WG_ADDRESS }}
        run: |
          sudo mkdir -p /etc/wireguard
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${WG_PRIVATE_KEY}
          Address = ${WG_ADDRESS}

          [Peer]
          PublicKey = ${WG_PEER_PUBKEY}
          AllowedIPs = ::/1, 8000::/1
          Endpoint = ${WG_ENDPOINT}
          PersistentKeepalive = 15
          EOF
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

          echo "### Aguardando handshake (até 20s) ###"
          HANDSHAKE_OK=0
          for i in $(seq 1 10); do
            sleep 2
            HS=$(sudo wg show wg0 latest-handshakes | awk '{print $2}')
            TRANSFER=$(sudo wg show wg0 transfer)
            echo "[tentativa $i/10] handshake epoch: '${HS:-vazio}' -- transfer: ${TRANSFER:-vazio}"
            if [ -n "$HS" ] && [ "$HS" != "0" ]; then
              echo ">>> Handshake confirmado (epoch $HS) <<<"
              HANDSHAKE_OK=1
              break
            fi
          done

          echo ""
          echo "### wg show (estado final) ###"
          sudo wg show wg0 dump

          if [ "$HANDSHAKE_OK" = "1" ]; then
            echo "### Testando ping via túnel ###"
            ping6 -c 3 -W 3 2a11:6c7:f35:e3::1 || echo "AVISO: handshake ok mas ping falhou (pode ser ICMP bloqueado, não é necessariamente problema)"
            echo "IPV6_TUNNEL_OK=true" >> "$GITHUB_ENV"
          else
            echo "### Verificando conntrack (prova em nível de kernel) ###"
            ENDPOINT_HOST=$(echo "$WG_ENDPOINT" | cut -d: -f1)
            sudo conntrack -L 2>/dev/null | grep "dst=${ENDPOINT_HOST}" || echo "(nenhuma entrada conntrack encontrada)"
            echo "::error::Handshake não completou mesmo após registar o IP via DynDNS2. Verifica a resposta do passo anterior (deveria ter sido 'good' ou 'nochg')."
            echo "IPV6_TUNNEL_OK=false" >> "$GITHUB_ENV"
          fi

      - name: Abortar se túnel IPv6 falhou (a menos que fallback seja permitido)
        if: ${{ env.IPV6_TUNNEL_OK != 'true' && !inputs.allow_ipv4_fallback }}
        run: |
          echo "::error::Parando o job: túnel IPv6/Route64 não subiu e allow_ipv4_fallback está desativado."
          echo "Rode de novo com 'allow_ipv4_fallback: true' se quiser mesmo assim testar só por IPv4."
          exit 1

      - name: Rodar teste SMTP nos domínios
        env:
          TEST_LANE: ${{ env.IPV6_TUNNEL_OK == 'true' && 'route64' || 'ipv4-fallback' }}
        run: python smtp_probe.py

      - name: Derrubar túnel
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptr-smtp-report-${{ github.run_id }}
          path: |
            report.json
            report.csv
            report.md
          retention-days: 30
