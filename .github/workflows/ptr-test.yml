name: PTR/SMTP Compatibility Test

on:
  workflow_dispatch:
    inputs:
      setup_dns:
        description: "Configurar SPF/DKIM/DMARC no deSEC antes do teste"
        type: boolean
        default: false
      allow_ipv4_fallback:
        description: "Continuar o teste mesmo se o túnel IPv6 falhar (não recomendado)"
        type: boolean
        default: false

jobs:
  ptr-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Configurar DNS (SPF/DKIM/DMARC) no deSEC
        if: ${{ inputs.setup_dns }}
        env:
          DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
          TEST_DOMAIN: veriscop.dedyn.io
          ROUTE64_IPV6_PREFIX: "2a11:6c7:f35:e3::/64"
        run: python dns_setup.py

      - name: Diagnóstico bruto de UDP (antes do WireGuard)
        env:
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y netcat-openbsd tcpdump

          ENDPOINT_HOST=$(echo "$WG_ENDPOINT" | cut -d: -f1)
          ENDPOINT_PORT=$(echo "$WG_ENDPOINT" | cut -d: -f2)

          echo "### Capturando tráfego UDP de/para ${ENDPOINT_HOST}:${ENDPOINT_PORT} ###"
          sudo timeout 10 tcpdump -ni any udp and host "$ENDPOINT_HOST" -w /tmp/udp_raw.pcap &
          TCPDUMP_PID=$!
          sleep 1

          echo "Enviando 3 pacotes UDP de teste..."
          for i in 1 2 3; do
            echo "probe-$i" | timeout 3 nc -u -w2 "$ENDPOINT_HOST" "$ENDPOINT_PORT" || true
            sleep 1
          done

          wait $TCPDUMP_PID 2>/dev/null || true

          echo ""
          echo "### Pacotes capturados (saída E entrada) ###"
          sudo tcpdump -nr /tmp/udp_raw.pcap 2>/dev/null || echo "Nenhum pacote capturado."

          SENT=$(sudo tcpdump -nr /tmp/udp_raw.pcap 2>/dev/null | grep -c "> ${ENDPOINT_HOST}" || true)
          RECV=$(sudo tcpdump -nr /tmp/udp_raw.pcap 2>/dev/null | grep -c "${ENDPOINT_HOST}.* >" || true)
          echo ""
          echo "Pacotes de SAÍDA vistos: ${SENT}"
          echo "Pacotes de ENTRADA vistos: ${RECV}"
          if [ "$RECV" = "0" ]; then
            echo "::warning::Nenhum pacote de retorno visto na camada de rede — bloqueio provavelmente antes do WireGuard (rede do runner/Azure), não é problema de config."
          else
            echo "::notice::Pacotes de retorno chegaram na rede — se o WireGuard ainda assim não fizer handshake, o problema está na camada do protocolo (formato/chave), não na rede."
          fi

      - name: Instalar WireGuard
        run: |
          sudo apt-get install -y wireguard-tools

      - name: Subir túnel WireGuard (Route64)
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          WG_PEER_PUBKEY: ${{ secrets.WG_PEER_PUBKEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_ADDRESS: ${{ secrets.WG_ADDRESS }}
        run: |
          sudo mkdir -p /etc/wireguard
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${WG_PRIVATE_KEY}
          Address = ${WG_ADDRESS}

          [Peer]
          PublicKey = ${WG_PEER_PUBKEY}
          AllowedIPs = ::/1, 8000::/1
          Endpoint = ${WG_ENDPOINT}
          PersistentKeepalive = 15
          EOF
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

          echo "### Aguardando handshake (até 15s) ###"
          for i in $(seq 1 5); do
            sleep 3
            HANDSHAKE=$(sudo wg show wg0 latest-handshakes | awk '{print $2}')
            if [ -n "$HANDSHAKE" ] && [ "$HANDSHAKE" != "0" ]; then
              echo "Handshake confirmado (epoch $HANDSHAKE) após ${i}x3s."
              break
            fi
            echo "Tentativa $i/5: ainda sem handshake..."
          done

          echo "### wg show (diagnóstico completo) ###"
          sudo wg show wg0

          echo "### Testando conectividade real via túnel ###"
          PING_OK=0
          for i in 1 2 3 4 5; do
            if ping6 -c 2 -W 3 2a11:6c7:f35:e3::1 > /tmp/ping_out.txt 2>&1; then
              PING_OK=1
              echo "Ping OK na tentativa $i."
              break
            fi
            echo "Tentativa $i/5 de ping falhou, tentando de novo em 3s..."
            sleep 3
          done
          cat /tmp/ping_out.txt

          if [ "$PING_OK" != "1" ]; then
            HANDSHAKE_FINAL=$(sudo wg show wg0 latest-handshakes | awk '{print $2}')
            echo "::error::Túnel WireGuard não está passando tráfego (ping falhou em 5 tentativas)."
            if [ -z "$HANDSHAKE_FINAL" ] || [ "$HANDSHAKE_FINAL" == "0" ]; then
              echo "::error::Nenhum handshake foi registrado. Veja o passo de diagnóstico UDP acima para saber se é bloqueio de rede ou de protocolo."
            else
              echo "::error::Handshake existe, mas não há resposta ao ping. Verifique se o peer aceita ICMP no endereço testado ou se há firewall bloqueando."
            fi
            echo "IPV6_TUNNEL_OK=false" >> "$GITHUB_ENV"
          else
            echo "IPV6_TUNNEL_OK=true" >> "$GITHUB_ENV"
          fi

      - name: Abortar se túnel IPv6 falhou (a menos que fallback seja permitido)
        if: ${{ env.IPV6_TUNNEL_OK != 'true' && !inputs.allow_ipv4_fallback }}
        run: |
          echo "::error::Parando o job: túnel IPv6/Route64 não subiu e allow_ipv4_fallback está desativado."
          echo "Rode de novo com 'allow_ipv4_fallback: true' se quiser mesmo assim testar só por IPv4."
          exit 1

      - name: Rodar teste SMTP nos domínios
        env:
          TEST_LANE: ${{ env.IPV6_TUNNEL_OK == 'true' && 'route64' || 'ipv4-fallback' }}
        run: python smtp_probe.py

      - name: Derrubar túnel
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptr-smtp-report-${{ github.run_id }}
          path: |
            report.json
            report.csv
            report.md
          retention-days: 30
