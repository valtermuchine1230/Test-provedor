name: PTR/SMTP Compatibility Test

on:
  workflow_dispatch:
    inputs:
      setup_dns:
        description: "Configurar SPF/DKIM/DMARC no deSEC antes do teste"
        type: boolean
        default: false
      allow_ipv4_fallback:
        description: "Continuar o teste mesmo se o túnel IPv6 falhar (não recomendado)"
        type: boolean
        default: false

jobs:
  ptr-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Configurar DNS (SPF/DKIM/DMARC) no deSEC
        if: ${{ inputs.setup_dns }}
        env:
          DESEC_TOKEN: ${{ secrets.DESEC_TOKEN }}
          TEST_DOMAIN: veriscop.dedyn.io
          ROUTE64_IPV6_PREFIX: "2a11:6c7:f35:e3::/64"
        run: python dns_setup.py

      - name: Diagnóstico de baseline UDP (isola a causa raiz)
        env:
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dnsutils

          ENDPOINT_HOST=$(echo "$WG_ENDPOINT" | cut -d: -f1)

          echo "### Teste 1: ICMP direto ao servidor do route64.org ###"
          if ping -c 3 -W 3 "$ENDPOINT_HOST"; then
            echo "ICMP_ROUTE64=ok" >> "$GITHUB_ENV"
          else
            echo "ICMP_ROUTE64=fail" >> "$GITHUB_ENV"
            echo "::warning::ICMP para o host do route64.org falhou."
          fi

          echo ""
          echo "### Teste 2: UDP contra destino público que sempre responde (DNS do Google) ###"
          if dig +time=3 +tries=1 @8.8.8.8 example.com > /tmp/dig_out.txt 2>&1; then
            cat /tmp/dig_out.txt
            echo "UDP_BASELINE=ok" >> "$GITHUB_ENV"
          else
            cat /tmp/dig_out.txt
            echo "UDP_BASELINE=fail" >> "$GITHUB_ENV"
            echo "::error::UDP de entrada NÃO funciona nem para 8.8.8.8 — bloqueio geral no runner, não é problema do route64.org."
          fi

      - name: Instalar WireGuard
        if: ${{ env.UDP_BASELINE == 'ok' }}
        run: sudo apt-get install -y wireguard-tools

      - name: Subir túnel WireGuard (Route64)
        if: ${{ env.UDP_BASELINE == 'ok' }}
        env:
          WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
          WG_PEER_PUBKEY: ${{ secrets.WG_PEER_PUBKEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_ADDRESS: ${{ secrets.WG_ADDRESS }}
        run: |
          sudo mkdir -p /etc/wireguard
          cat <<EOF | sudo tee /etc/wireguard/wg0.conf
          [Interface]
          PrivateKey = ${WG_PRIVATE_KEY}
          Address = ${WG_ADDRESS}

          [Peer]
          PublicKey = ${WG_PEER_PUBKEY}
          AllowedIPs = ::/1, 8000::/1
          Endpoint = ${WG_ENDPOINT}
          PersistentKeepalive = 15
          EOF
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

          for i in $(seq 1 5); do
            sleep 3
            HANDSHAKE=$(sudo wg show wg0 latest-handshakes | awk '{print $2}')
            [ -n "$HANDSHAKE" ] && [ "$HANDSHAKE" != "0" ] && break
            echo "Tentativa $i/5: ainda sem handshake..."
          done
          sudo wg show wg0

          PING_OK=0
          for i in 1 2 3 4 5; do
            ping6 -c 2 -W 3 2a11:6c7:f35:e3::1 && { PING_OK=1; break; }
            sleep 3
          done

          if [ "$PING_OK" != "1" ]; then
            echo "::error::Túnel não passou tráfego mesmo com baseline UDP OK — problema específico do endpoint/porta do route64.org, não da rede do runner."
            echo "IPV6_TUNNEL_OK=false" >> "$GITHUB_ENV"
          else
            echo "IPV6_TUNNEL_OK=true" >> "$GITHUB_ENV"
          fi

      - name: Diagnóstico final (se baseline falhou)
        if: ${{ env.UDP_BASELINE == 'fail' }}
        run: |
          echo "::error::Bloqueio geral de UDP de entrada confirmado no runner do GitHub Actions."
          echo "Isso não é corrigível por configuração — o runner efêmero não recebe resposta UDP de nenhum destino."
          echo "Alternativas reais: (1) usar Tailscale (github.com/tailscale/github-action, oficialmente suportado em runners hospedados) em vez de WireGuard cru; (2) rodar o túnel numa VPS própria persistente e o Actions só chamar essa VPS via SSH/API."
          echo "IPV6_TUNNEL_OK=false" >> "$GITHUB_ENV"

      - name: Abortar se túnel IPv6 falhou (a menos que fallback seja permitido)
        if: ${{ env.IPV6_TUNNEL_OK != 'true' && !inputs.allow_ipv4_fallback }}
        run: |
          echo "::error::Parando o job: túnel IPv6/Route64 não subiu e allow_ipv4_fallback está desativado."
          exit 1

      - name: Rodar teste SMTP nos domínios
        env:
          TEST_LANE: ${{ env.IPV6_TUNNEL_OK == 'true' && 'route64' || 'ipv4-fallback' }}
        run: python smtp_probe.py

      - name: Derrubar túnel
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Upload do relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptr-smtp-report-${{ github.run_id }}
          path: |
            report.json
            report.csv
            report.md
          retention-days: 30
